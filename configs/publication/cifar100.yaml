# Complete ExperimentConfig for the cifar100 dataset.

# Paths and dataset
dataset: cifar100
data_root: "./data"
results_root: "./results"
checkpoint_paths:
  cifar10: "./checkpoints/cifar10_trained_original.keras"
  cifar100: "./checkpoints/cifar100_trained_original.keras"
  imagewoof: "./checkpoints/imagewoof_trained_original.keras"
  imagenet100: "./checkpoints/imagenet100_model.keras"
initial_weights_paths:
  cifar10: ''
  cifar100: ''
  imagewoof: ''
  imagenet100: ''
imagenet100_root: "./data/imagenet100"
forget_classes_by_dataset:
  cifar10:
  - 5
  cifar100:
  - 64
  imagewoof:
  - 0
  imagenet100:
  - 0

# Execution and data pipeline
run_mode: publication
seeds:
- 42
- 52
- 62
batch_size: 64
eval_batch_size: 128
data_parallel_calls: 2
data_prefetch_batches: 1
data_private_threadpool_size: 2
shuffle_buffer: 4096
output_is_logits: null
fallback_architecture: resnet18

# Epochs
original_epochs: 100
retrain_epochs: 100
baseline_epochs: 8
scrub_epochs: 6
refine_epochs: 8
clamp_epochs: 1

# Learning rates
original_lr: 0.001
retrain_lr: 0.001
baseline_lr: 0.001
scrub_lr: 0.002
refine_lr: 0.001

# Proxy synthesis
proxy_count: 1024
proxy_steps: 250
proxy_batch_size: 32
proxy_lr: 1.0
proxy_tv_weight: 2.0e-05
proxy_l2_weight: 1.0e-06

# ScrubRef loss weights
mixup_alpha: 0.2
kd_temperature: 3.0
retain_ce_weight: 1.0
retain_kd_weight: 0.8
retain_feature_weight: 0.2
forget_output_weight: 1.0
forget_entropy_weight: 0.15
forget_feature_weight: 0.5

# Architecture and safety controls
head_tail_layers: 0
representation_tail_layers: 12
gradient_clip_norm: 5.0
clamp_threshold: 0.05
enable_main_method_clamp: false
enable_main_method_logit_surgery: false
logit_surgery_shift: 6.0

# Evaluation
retrain_validation_fraction: 0.1
probe_train_limit: 10000
probe_test_limit: 5000
cka_sample_limit: 1500
mia_attack_repeats: 5

# Baseline-specific settings
ssd_fisher_batches: 40
ssd_selection_weighting: 10.0
ssd_dampening_constant: 1.0
unsir_noise_steps: 120
unsir_impair_lr: 0.02
unsir_repair_lr: 0.01

# Enabled methods                                                                        
enabled_methods:
- original
- retrained
- logit_clamp
- head_reset
- retain_finetune
- scrubref_head
- scrubref_rep
- unsir
- bad_teacher
- scrub
- ssd
representation_methods:
- original
- retrained
- logit_clamp
- scrubref_head
- scrubref_rep
- unsir
- bad_teacher
- scrub
- ssd

# Output and download
save_models: true
download_imagewoof: true
